name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Test core and Tk interface (Windows)
        if: runner.os == 'Windows'
        run: python -W error::DeprecationWarning -m unittest discover -s tests -v
      - name: Test core and Tk interface (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -W error::DeprecationWarning -m unittest discover -s tests -v
